- name: Run Cppcheck
  run: |
    cppcheck \
      --enable=warning,style,performance,portability \
      --inline-suppr \
      --std=c11 \
      --platform=unix64 \
      -I"${{ github.workspace }}/App/Inc" \
      "${{ github.workspace }}/App/Src" \
      --error-exitcode=1 \
      --suppress=missingIncludeSystem \
      --suppress=unusedFunction \
      2>&1 | tee cppcheck-report.txt