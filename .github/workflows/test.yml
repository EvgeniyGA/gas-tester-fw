name: Ceedling Test and Code Coverage

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  checks: write      # for JUnit-report
  contents: read     # for checkout
  actions: read      # for upload-artifact

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build test container
      run: docker compose build ceedling-tests

    - name: Run Ceedling tests
      run: docker compose run --rm ceedling-tests ceedling test:all

    - name: Run coverage (gcov)
      run: docker compose run --rm ceedling-tests ceedling gcov:all

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: gcov-report
        path: build/artifacts/gcov/
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/artifacts/test/
        retention-days: 7

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: success() || failure()
      with:
        detailed_summary: true
        include_passed: true
        report_paths: "build/artifacts/test/junit_tests_report.xml"

    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: build/artifacts/gcov/gcovr/GcovCoverageCobertura.xml
        badge: true
        format: "markdown"
        output: "both"
    - name: Write coverage to Job Summary
      run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  # 🚀 DEPLOY: Публикация бейджа и HTML-отчёта на GitHub Pages
  deploy-coverage:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write  # ← нужно для деплоя в gh-pages
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: gcov-report
          path: ./gcov-report

      - name: Deploy coverage badge
        run: |
          # Копируем бейдж в папку badges/
          mkdir -p gh-pages/badges
          find ./gcov-report -name "coverage-badge.svg" -exec cp {} gh-pages/badges/ \; || true
          
          # Копируем весь HTML-отчёт в coverage/
          mkdir -p gh-pages/coverage
          cp -r ./gcov-report/* gh-pages/coverage/ 2>/dev/null || true
          
          # Коммитим изменения
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "📊 Update coverage report [skip ci]" || exit 0
          git push

      - name: Update README badge URL (опционально)
        run: |
          # Если хочешь, чтобы бейдж всегда вёл на актуальный отчёт
          echo "Badge URL: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/badges/coverage-badge.svg"